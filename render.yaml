services:
  - type: web
    name: esp32-file-server
    env: python
    buildCommand: pip install -r requirements.txt && mkdir -p /tmp/uploads/pending /tmp/uploads/processed
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: RENDER
        value: "true"