<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEARTH - ESP32 File Upload</title>
    <link rel="stylesheet" href="static\style.css">
    <script src="static\script.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">HEARTH</h1>
            <p>ESP32 File Upload System</p>
        </header>
        
        <div class="frame">
            <div class="frame-inner">
                <div class="frame-content">
                    <!-- This can display the latest uploaded image or status -->
                </div>
            </div>
        </div>
        
        <div class="upload-container">
            <h2>Upload Files to ESP32</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="file-upload">
                    <label for="imageFile">Upload Image (Max 50KB):</label>
                    <div class="file-input-container">
                        <input type="file" id="imageFile" name="file" class="file-input" accept="image/*">
                    </div>
                </div>
                
                <div class="file-upload">
                    <label for="soundFile">Upload Sound File:</label>
                    <div class="file-input-container">
                        <input type="file" id="soundFile" name="file" class="file-input" accept="audio/*">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Upload Files</button>
                <progress id="uploadProgress" value="0" max="100" style="display: none;"></progress>
            </form>
            
            <div id="uploadStatus" class="upload-status"></div>
        </div>
        
        <div class="file-list">
            <h2>Recent Uploads</h2>
            <ul id="fileList">
                <!-- Files will be listed here via JavaScript -->
            </ul>
        </div>
        
        <footer class="footer">
            <!-- Footer content -->
        </footer>
        
        <!-- Corner image -->
        <img src="static\frame_4_v14_v1.png" alt="Hearth Logo" class="corner-image">
    </div>

    <!-- JavaScript is now loaded from external file script.js -->
</body>
</html>
